version: "v0.4"

project:
  name: "Unique-Continuation-Planar"
  description: >-
    A Lean 4 formalization of every theorem, lemma and proposition of "Unique
    continuation on planar graphs" (Bou-Rabee, Cooperman and Ganguly): a
    harmonic function on a periodic plane graph with periodic conductances
    that is bounded by one on a set of density at least 1 - epsilon is
    constant (Theorem 1.1), together with the exponential upper bound
    (Theorem 1.2), the zero case (Theorem 1.3), the topological lemma, the
    exponential lower bound of the appendix with its polynomial approximation
    lemma and three-ball proposition, and non-planar periodic conductances on
    Z^2 with a harmonic function supported on a diagonal (Theorem 5.1).  Three
    results the paper cites from the literature (Janiszewski's theorem at a
    point, unicoherence of the sphere and the discrete Moser estimate) are
    explicit hypotheses of the theorems that use them; the classical Liouville
    theorem for periodic networks and the discrete Remez inequality are proved.
    The four main theorems are independently checked using the UCPlanarAudit/
    comparator pairs.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Unique continuation on planar graphs"
    authors:
      - "Ahmed Bou-Rabee"
      - "William Cooperman"
      - "Shirshendu Ganguly"
    id: "doi:10.19086/da.144015"
    url: "https://doi.org/10.19086/da.144015"
    type: "article"
    relationship: "formalizes"
    note: >-
      The paper under formalization (Discrete Analysis 2025:16; arXiv:2309.13728).
      The formalizer is an author of the source.  The Lean statements transcribe
      paper/ucplanar.tex, which is arXiv:2309.13728v2 with the corrections
      listed in paper/CHANGES_FROM_ARXIV.md.
    license: ""                 # TODO(author): the license under which the paper is published
    author_endorsement: "n/a"   # the formalizer is an author of the source

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      Lattice-Probability (shared Lean library LatticeProb, pinned git
      dependency at commit 9d44b4d4670df393bb86ac5a4e042f215001cddf): graph
      balls, conductances, the network Laplacian and harmonic functions.  A
      separate formalization, not written for this repository.
  - id: "https://github.com/alonamaloh/schoenflies-lean"
    relationship: "builds-on"
    note: >-
      schoenflies-lean of Álvaro Begué (pinned git dependency at commit
      05a43d29cde026618777db3d4e4316204ccca237): the planar Jordan and
      crosscut theorems.  A separate formalization, not written for this
      repository.

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every theorem, lemma and proposition of
    the paper: the quantitative Liouville theorem for periodic conductances on
    periodic plane graphs (Theorem 1.1), the exponential upper bound (Theorem
    1.2), the zero case (Theorem 1.3), the topological lemma (Lemma 2.1), the
    non-planar counterexample on the square lattice (Theorem 5.1), and the
    exponential lower bound of the appendix with its polynomial approximation
    lemma and three-ball proposition (Theorem A.1, Lemma A.2, Proposition
    A.3).  SCOPE BOUNDARY: three results the paper cites from the literature
    are stated as propositions in UCPlanar/External/ and are explicit
    hypotheses of every theorem whose proof uses them: Janiszewski's theorem at
    a point for the drawings of two finite edge sets (EdgeSplitting),
    unicoherence of the sphere as connectedness of the frontier of a bounded
    face (Unicoherence), and the discrete Moser estimate (MoserEstimate);
    ASSUMPTIONS.md lists them with their Lean statements.  Two further cited
    results, the bounded Liouville theorem for the periodic network and the
    discrete Remez inequality, are proved here.  Not formalized: the survey of
    related work and applications, the remark following Theorem 1.3, the
    figures, and Step 1 of the proof of Theorem 1.3 (the reduction by deleting
    and contracting finite edge-connected components), which the formalization
    replaces by a direct proof on the periodic plane graph.  The main theorems
    are stated in full in UCPlanar/MainTheorems.lean; all four are
    additionally restated over a Mathlib-only vocabulary for the Lean
    comparator (UCPlanarAudit/).
  sorry_count: 0
  sorry_count_scope: "UCPlanar production library only"
  comparator_challenge_sorry_count: 4
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "UCPlanar.liouville"
      file: "UCPlanar/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "UCPlanarAudit/Liouville/comparator.json"
      literature_dependencies:
        - statement: "The discrete Moser estimate (UCPlanar.External.MoserEstimate), carried as an explicit hypothesis"
          source: "Delmotte 1999, Proposition 5.3"
        - statement: "Janiszewski's theorem at a point (UCPlanar.External.EdgeSplitting), carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter V, Theorem 9.3"
        - statement: "Unicoherence of the sphere (UCPlanar.External.Unicoherence), carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter VI, unicoherence of the sphere"
    - declaration: "UCPlanar.uniformlyBounded"
      file: "UCPlanar/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "UCPlanarAudit/UniformlyBounded/comparator.json"
      literature_dependencies:
        - statement: "Janiszewski's theorem at a point (UCPlanar.External.EdgeSplitting), carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter V, Theorem 9.3"
        - statement: "Unicoherence of the sphere (UCPlanar.External.Unicoherence), carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter VI, unicoherence of the sphere"
    - declaration: "UCPlanar.zeroCase"
      file: "UCPlanar/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "UCPlanarAudit/ZeroCase/comparator.json"
      literature_dependencies:
        - statement: "Janiszewski's theorem at a point (UCPlanar.External.EdgeSplitting), carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter V, Theorem 9.3"
        - statement: "Unicoherence of the sphere (UCPlanar.External.Unicoherence), carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter VI, unicoherence of the sphere"
    - declaration: "UCPlanar.counterexample"
      file: "UCPlanar/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "UCPlanarAudit/Counterexample/comparator.json"
      literature_dependencies: []
    - declaration: "UCPlanarAudit.liouville"
      file: "UCPlanarAudit/Liouville/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "UCPlanarAudit/Liouville/comparator.json"
      literature_dependencies:
        - statement: "The discrete Moser estimate, restated over the Mathlib-only vocabulary, carried as an explicit hypothesis"
          source: "Delmotte 1999, Proposition 5.3"
        - statement: "Janiszewski's theorem at a point, restated over the Mathlib-only vocabulary, carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter V, Theorem 9.3"
        - statement: "Unicoherence of the sphere, restated over the Mathlib-only vocabulary, carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter VI, unicoherence of the sphere"
    - declaration: "UCPlanarAudit.uniformlyBounded"
      file: "UCPlanarAudit/UniformlyBounded/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "UCPlanarAudit/UniformlyBounded/comparator.json"
      literature_dependencies:
        - statement: "Janiszewski's theorem at a point, restated over the Mathlib-only vocabulary, carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter V, Theorem 9.3"
        - statement: "Unicoherence of the sphere, restated over the Mathlib-only vocabulary, carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter VI, unicoherence of the sphere"
    - declaration: "UCPlanarAudit.zeroCase"
      file: "UCPlanarAudit/ZeroCase/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "UCPlanarAudit/ZeroCase/comparator.json"
      literature_dependencies:
        - statement: "Janiszewski's theorem at a point, restated over the Mathlib-only vocabulary, carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter V, Theorem 9.3"
        - statement: "Unicoherence of the sphere, restated over the Mathlib-only vocabulary, carried as an explicit hypothesis"
          source: "Newman, Elements of the Topology of Plane Sets of Points, Chapter VI, unicoherence of the sphere"
    - declaration: "UCPlanarAudit.counterexample"
      file: "UCPlanarAudit/Counterexample/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "UCPlanarAudit/Counterexample/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
        - "Claude Sonnet 5"
        - "Claude Opus 5"
        - "DeepSeek v4.1 Flash"
      framework: >-
        Claude Code (Anthropic) and the Pi agent harness, directing the models above; the author
        supervised the work and is responsible for the formalization.
      tool_setup: >-
        Lake builds under the pinned Lean toolchain and Mathlib revision. Every change is gated by
        the axiom-closure and warning-free-build checks, and the public CI runs the Mathlib-only
        comparator challenge/solution pairs against leanprover/comparator, lean4export and landrun
        at the revisions recorded in .github/workflows/.
      cost:
        spend_usd: "not separately tracked (subscription and API accounts)"
        hardware: "one Ubuntu workstation"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the author. Statement differences from the
        paper are disclosed under fidelity.
fidelity:
  divergences: >-
    The Lean statements transcribe paper/ucplanar.tex, which is
    arXiv:2309.13728v2 with the corrections listed in
    paper/CHANGES_FROM_ARXIV.md.  Step 1 of the proof of Theorem 1.3 is not
    formalized, the statement being proved directly for the periodic plane
    graph with the surrounding cycles supplied by the cited plane inputs.
    Theorem 1.1 makes the density limit explicit, as a real number d with
    1 - epsilon <= d.  The three cited results enter as hypotheses whose Lean
    statements are in ASSUMPTIONS.md; that they render the cited theorems
    faithfully is a reading, not a check.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The author decided the statement-level questions.
    The statements were additionally audited by GLM-5.3 and by Claude Opus 5
    agents.  This is not external peer review.

alignment:
  namespace: "UCPlanar"
  statements:
    - source: "Theorem 1.1 (theorem:liouville)"
      lean: "UCPlanar.liouville"
      module: "UCPlanar.MainTheorems"
      status: "proved"
      note: "Certified statement UCPlanar.Frozen.liouville (N-001). Comparator challenge UCPlanarAudit/Liouville/."
    - source: "Theorem 1.2 (theorem:uniformly-bounded)"
      lean: "UCPlanar.uniformlyBounded"
      module: "UCPlanar.MainTheorems"
      status: "proved"
      note: "Certified statement UCPlanar.Frozen.uniformlyBounded (N-002). Comparator challenge UCPlanarAudit/UniformlyBounded/."
    - source: "Theorem 1.3 (theorem:zero-case)"
      lean: "UCPlanar.zeroCase"
      module: "UCPlanar.MainTheorems"
      status: "proved"
      note: "Certified statement UCPlanar.Frozen.zeroCase (N-003). Comparator challenge UCPlanarAudit/ZeroCase/."
    - source: "Theorem 5.1 (theorem:counterexample)"
      lean: "UCPlanar.counterexample"
      module: "UCPlanar.MainTheorems"
      status: "proved"
      note: "Certified statement UCPlanar.Frozen.counterexample (N-005). Comparator challenge UCPlanarAudit/Counterexample/."
    - source: "Lemma 2.1 (lemma:topological-lemma)"
      lean: "UCPlanar.Frozen.topological"
      module: "UCPlanar.Frozen.Topological"
      status: "proved"
      note: "N-004."
    - source: "Theorem A.1 (theorem:lower-bound), periodic form"
      lean: "UCPlanar.Frozen.periodicLowerBound"
      module: "UCPlanar.Frozen.PeriodicLowerBound"
      status: "proved"
      note: "N-008."
    - source: "Lemma A.2 (lemma:poly-approx)"
      lean: "UCPlanar.Frozen.polynomialApproximation"
      module: "UCPlanar.Frozen.PolynomialApproximation"
      status: "proved"
      note: "N-007."
    - source: "Proposition A.3 (prop:three-ball)"
      lean: "UCPlanar.Frozen.threeBall"
      module: "UCPlanar.Frozen.ThreeBall"
      status: "proved"
      note: "N-006."
    - source: "Cited results (Janiszewski's theorem at a point, unicoherence of the sphere, the discrete Moser estimate)"
      lean: "UCPlanar.External.*"
      module: "UCPlanar.External"
      status: "literature-dependency"
      note: "Explicit hypotheses of the theorems that use them; listed in ASSUMPTIONS.md."

acknowledgements: >-
  The paper is joint work with William Cooperman and Shirshendu Ganguly.
  Built on Lean 4, Mathlib, Lake, the shared library Lattice-Probability, the
  Schoenflies library schoenflies-lean of Alvaro Begue, and
  leanprover/comparator.
